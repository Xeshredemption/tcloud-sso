[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `tcloud` is taken on PyPI by an unrelated project; the command is still `tcloud`.
name = "tcloud-sso"
dynamic = ["version"]
description = "Profile registry and one-approval multi-account SSO login for the Tencent Cloud CLI (tccli)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Xeshredemption" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# Capped below the next minor because tcloud uses tccli-private functions;
# tests/test_tccli_contract.py guards them.
dependencies = ["tccli-intl-en>=3.1.164,<3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tcloud = "tcloud:main"

[project.urls]
Source = "https://github.com/Xeshredemption/tcloud-sso"
Issues = "https://github.com/Xeshredemption/tcloud-sso/issues"

[tool.setuptools.dynamic]
version = { attr = "tcloud.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a newer ruff or a user-global config cannot widen it. The
# codebase uses %-formatting on purpose; this set catches real bugs, not style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
